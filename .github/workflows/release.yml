name: Release

# Push a tag like v1.2.0 to build, test and publish the .COM files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build, audit, test
        run: |
          ./build.sh
          python3 release_audit.py
          tests/run_tests.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" t "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" UBERSHOW.COM SHA256SUMS screenshot.jpg \
            --title "UBER40K $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
