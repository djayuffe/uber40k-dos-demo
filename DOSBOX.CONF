[sdl]
fullscreen=false
[dosbox]
machine=svga_s3
[cpu]
core=auto
cycles=max
[sblaster]
; UBERSHOW.COM drives the OPL2 FM chip directly at the fixed 388h/389h port
; every Sound Blaster card exposes for AdLib compatibility -- sbbase/irq/dma
; don't matter for this demo since it never touches the DSP, only the FM
; synth, but oplmode must stay OPL2-compatible.
sbtype=sb16
oplmode=auto
[autoexec]
# mount c /path/to/dos256demo
# c:
# UBER256.COM
